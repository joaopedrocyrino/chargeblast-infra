# Production stack on the shared VPS.
#
# HTTPS and routing are handled by the server's existing `caddy-docker-proxy`,
# which owns ports 80/443 and reads
# routes from container labels on the external `proxy` network. This stack
# publishes no ports of its own:
#   FRONTEND_DOMAIN → frontend:3000
#   API_DOMAIN      → backend:4000
# PostgreSQL sits on an internal network with no route to the internet, no
# published port and no domain: only the API (and the one-shot migrate job)
# can reach it.
#
#   cp .env.production.example .env.production   # fill in the secret
#   docker compose -f compose.prod.yaml --env-file .env.production up -d --build
name: chargeblast

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chargeblast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chargeblast}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 256M

  # One-shot: apply migrations and the idempotent demo seed, then exit.
  migrate:
    build:
      context: ${BACKEND_PATH:-../chargeblast-backend}
      target: runtime
    image: chargeblast-backend:prod
    command: ["sh", "-c", "node dist/database/cli/migrate.js && node dist/database/cli/seed.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-chargeblast}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chargeblast}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  backend:
    build:
      context: ${BACKEND_PATH:-../chargeblast-backend}
      target: runtime
    image: chargeblast-backend:prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-chargeblast}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chargeblast}
      CORS_ORIGIN: https://${FRONTEND_DOMAIN:?set FRONTEND_DOMAIN}
      PAYMENT_CREATE_LIMIT: ${PAYMENT_CREATE_LIMIT:-3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [proxy, data]
    labels:
      caddy: ${API_DOMAIN:?set API_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 4000}}"
      caddy.encode: zstd gzip
      # Matches the API's own 16 KB JSON limit; bigger bodies never reach Node.
      caddy.request_body.max_size: 16KB
      caddy.header.-Server: ""
      caddy.header.Strict-Transport-Security: max-age=31536000; includeSubDomains
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.Referrer-Policy: strict-origin-when-cross-origin
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: ${FRONTEND_PATH:-../chargeblast-frontend}
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
    image: chargeblast-frontend:prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [proxy]
    labels:
      caddy: ${FRONTEND_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.encode: zstd gzip
      caddy.header.-Server: ""
      caddy.header.Strict-Transport-Security: max-age=31536000; includeSubDomains
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  # Shared with caddy-docker-proxy (it routes every project on the server).
  proxy:
    external: true
  # API ↔ PostgreSQL only; `internal` blocks any traffic to or from outside.
  data:
    name: chargeblast_data
    internal: true

volumes:
  pgdata:
    name: chargeblast_pgdata
